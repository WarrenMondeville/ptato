<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 383" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#faf6ee"/>
      <stop offset="1" stop-color="#f2f0e9"/>
    </linearGradient>
  </defs>
  <rect width="900" height="383" fill="url(#bg)"/>

  <!-- 锚点 + 悬链线绳索 -->
  <rect x="96" y="52" width="14" height="14" rx="3" fill="none" stroke="#1d7f93" stroke-width="2.2"/>
  <path d="M103,66 C 150,190 240,236 320,240 C 400,244 470,196 508,128"
        fill="none" stroke="#1d7f93" stroke-width="2.6" stroke-linecap="round"/>
  <g fill="#fff" stroke="#1d7f93" stroke-width="2">
    <circle cx="152" cy="168" r="4.5"/><circle cx="205" cy="212" r="4.5"/><circle cx="262" cy="233" r="4.5"/>
    <circle cx="320" cy="240" r="4.5"/><circle cx="378" cy="231" r="4.5"/><circle cx="436" cy="203" r="4.5"/>
    <circle cx="478" cy="160" r="4.5"/>
  </g>

  <!-- 显式欧拉的螺旋（被划掉的轨迹） -->
  <path d="M620,96 c 40,-8 62,26 48,58 c -12,28 -52,32 -70,10 c -16,-20 -4,-50 22,-56 c 22,-5 40,12 38,32"
        fill="none" stroke="#b9c6d6" stroke-width="2" stroke-dasharray="5 5"/>
  <circle cx="658" cy="140" r="5" fill="#8fa6bd"/>

  <!-- 速度向量 -->
  <g stroke="#1d7f93" stroke-width="2.4" stroke-linecap="round">
    <line x1="320" y1="240" x2="392" y2="268"/>
    <path d="M392,268 l -14,-3 M392,268 l -4,-13" fill="none"/>
  </g>

  <!-- 网格布料（右下） -->
  <g stroke="#7fb6c9" stroke-width="1.4" fill="none">
    <path d="M600,208 C 640,240 700,258 760,258 C 820,258 866,240 892,208"/>
    <path d="M600,208 L 600,150 M664,246 L 664,150 M760,258 L 760,150 M856,246 L 856,150 M892,208 L 892,150"/>
    <path d="M600,150 L 892,150" stroke="#4d94ad"/>
    <path d="M600,183 C 648,206 704,217 760,217 C 816,217 862,206 892,183"/>
    <path d="M600,232 C 640,258 700,272 760,272 C 820,272 866,258 892,232" opacity="0.7"/>
  </g>
  <g fill="#4d94ad">
    <circle cx="600" cy="150" r="4"/><circle cx="664" cy="150" r="4"/><circle cx="760" cy="150" r="4"/>
    <circle cx="856" cy="150" r="4"/><circle cx="892" cy="150" r="4"/>
  </g>

  <!-- 粒子点缀 -->
  <g fill="#1d7f93" opacity="0.55">
    <circle cx="150" cy="90" r="2.5"/><circle cx="560" cy="70" r="2.5"/><circle cx="540" cy="300" r="2.5"/>
    <circle cx="210" cy="320" r="2.5"/><circle cx="70" cy="300" r="2.5"/>
  </g>
</svg>
